<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>barotable-pagetest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
  <link rel="stylesheet" href="../static/css/app.css" th:href="@{/css/app.css}">
</head>
<!-- C-01 매장 소개와 빠른 예약 시작 -->
<body data-depth="0" data-screen="index" th:data-server="true">
  <header class="site-head">
    <div class="wrap">
      <a class="brand" href="index.html" th:href="@{/}" data-go="index">바로테이블</a>
      <span class="head-store" id="head-store">바로키친 성수점</span>
      <span class="head-sub" id="head-sub">이탈리안 다이닝 · 성수</span>
      <span class="head-spacer"></span>
      <a class="head-link" href="owner/login.html" th:href="@{/owner/login}" data-go="owner-login">점주·관리자 로그인</a>
    </div>
  </header>

  <main class="page wrap">
    <div class="grid cols-2" style="align-items:stretch">
      <!-- 매장 소개 -->
      <section class="card card-dark hero-store" aria-labelledby="store-name">
        <div class="stack" style="gap:10px">
          <span class="badge badge-solid" id="open-badge" style="align-self:flex-start"><span class="dot"></span>영업 중</span>
          <h1 id="store-name">바로키친 성수점</h1>
          <p class="muted" id="store-cat">이탈리안 다이닝</p>
        </div>
        <dl class="hours">
          <dt>영업시간</dt><dd id="h-open">11:30 – 22:00</dd>
          <dt>브레이크</dt><dd id="h-break">15:00 – 17:00</dd>
          <dt>예약 가능</dt><dd>2026년 10월 · 30분 단위</dd>
        </dl>
        <div class="floor-mini"><span>1층 · 창가 구역, 홀 중앙, 바 카운터</span><span>2층 · 테라스, 라운지, 단체룸</span></div>
      </section>

      <!-- 일반 사용자 -->
      <section class="card" aria-labelledby="guest-title">
        <div class="card-head" style="margin-bottom:6px">
          <div>
            <h2 id="guest-title">일반 사용자</h2>
            <p class="card-sub">새 예약 또는 예약 조회</p>
          </div>
        </div>
        <div class="stack">
          <div class="field">
            <label for="g-phone">전화번호</label>
            <input class="input mono" id="g-phone" placeholder="010-0000-0000">
          </div>
          <div class="field">
            <label for="g-name">이름 <span class="faint">(첫 방문)</span></label>
            <input class="input" id="g-name" placeholder="홍길동">
          </div>
          <p class="notice">첫 방문에는 이름도 함께 입력합니다. 다음 예약부터는 전화번호만 사용합니다.</p>
          <div class="form-row">
            <a class="btn btn-primary" href="reserve.html" th:href="@{/reserve}" data-go="reserve">새 예약 시작</a>
            <a class="btn btn-ghost" href="lookup.html" th:href="@{/reservations/lookup}" data-go="lookup">예약 조회</a>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="../static/js/data.js" th:src="@{/js/data.js}"></script>
  <script src="../static/js/common.js" th:src="@{/js/common.js}"></script>
</body>
</html>
