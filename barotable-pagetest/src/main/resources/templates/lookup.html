<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>바로테이블 · 예약 조회</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
  <link rel="stylesheet" href="../static/css/app.css" th:href="@{/css/app.css}">
</head>
<!-- C-07 비회원 예약 조회 · 취소 -->
<body data-depth="0" data-screen="lookup" th:data-server="true">
  <header class="site-head">
    <div class="wrap">
      <a class="brand" href="index.html" th:href="@{/}" data-go="index">바로테이블</a>
      <span class="head-store">바로키친 성수점</span>
    </div>
  </header>
  <main class="page wrap" style="max-width:560px">
    <div class="page-title"><div><h1>비회원 예약 조회</h1><p>예약번호와 연락처로 예약을 확인하거나 취소할 수 있습니다.</p></div></div>
    <section class="card stack" aria-label="예약 조회">
      <form class="stack" id="lk-form" autocomplete="off">
        <div class="field"><label for="lk-no">예약번호</label><input class="input mono" id="lk-no" value="BT-20261010-0031" required></div>
        <div class="field"><label for="lk-phone">연락처</label><input class="input mono" id="lk-phone" value="010-0000-0000" inputmode="tel" required></div>
        <button class="btn btn-primary" type="submit">예약 조회</button>
      </form>
      <div class="stack" id="lk-result" aria-live="polite" hidden></div>
    </section>
    <p class="hint" style="margin-top:12px">시연용 예약: BT-20261005-0025 / 010-8888-9999 (오늘 19:30, 취소 가능)</p>
    <p style="margin-top:16px"><a href="index.html" th:href="@{/}" data-go="index">← 매장 첫 화면</a></p>
  </main>
  <script src="../static/js/data.js" th:src="@{/js/data.js}"></script>
  <script src="../static/js/common.js" th:src="@{/js/common.js}"></script>
  <script src="../static/js/pages/lookup.js" th:src="@{/js/pages/lookup.js}"></script>
</body>
</html>
